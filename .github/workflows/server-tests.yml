name: Server tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Run server tests
        run: dotnet test polrob.Server.Tests/polrob.Server.Tests.csproj --configuration Release --filter "TestCategory!=Soak"

    </g>
    <g fill="#ffc21c" opacity=".3">
      <rect x="1204" y="470" width="10" height="18"/><rect x="1241" y="443" width="10" height="18"/><rect x="1283" y="477" width="10" height="18"/><rect x="1320" y="459" width="10" height="18"/>
    </g>
  </g>

  <g transform="translate(128 182)" filter="url(#shadow)">
    <path d="M90 0l75 30v62c0 66-42 111-75 127C57 203 15 158 15 92V30Z" fill="#0a4daa" stroke="#62b9ff" stroke-width="7"/>
    <path d="M90 29l38 15v45c0 38-20 67-38 80-18-13-38-42-38-80V44Z" fill="#1685ff"/>
    <path d="M90 49l11 25 27 3-20 18 6 27-24-14-24 14 6-27-20-18 27-3Z" fill="#ffd33d"/>
  </g>

  <g transform="translate(1120 184)" filter="url(#shadow)">
    <circle cx="90" cy="90" r="82" fill="#111" stroke="#ffb313" stroke-width="7"/>
    <path d="M36 70q54-42 108 0l-8 21q-46-28-92 0Z" fill="#2b2b2b"/>
    <path d="M54 98l24 8-18 16Z" fill="#fff"/><path d="M126 98l-24 8 18 16Z" fill="#fff"/>
    <path d="M58 38q32-31 64 0l20 28H38Z" fill="#171717" stroke="#3c3c3c" stroke-width="5"/>
  </g>

  <g filter="url(#shadow)" font-family="Arial Black, Arial, sans-serif" font-size="178" font-weight="900" font-style="italic" letter-spacing="-15">
    <text x="710" y="274" text-anchor="end" fill="url(#pol)" stroke="#07101e" stroke-width="22" paint-order="stroke">Pol</text>
    <text x="710" y="274" text-anchor="start" fill="url(#rob)" stroke="#07101e" stroke-width="22" paint-order="stroke">Rob</text>
    <text x="710" y="274" text-anchor="end" fill="none" stroke="#eef7ff" stroke-opacity=".18" stroke-width="3">Pol</text>
    <text x="710" y="274" text-anchor="start" fill="none" stroke="#eef7ff" stroke-opacity=".18" stroke-width="3">Rob</text>
  </g>

  <rect x="385" y="330" width="670" height="3" rx="2" fill="url(#line)"/>
  <text x="720" y="386" fill="#f3f5f7" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="7">POLICE  VS  ROBBERS</text>
  <text x="720" y="432" fill="#929ba6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" letter-spacing="3">REAL-TIME MULTIPLAYER · GAME SERVER PORTFOLIO</text>

  <g font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <g transform="translate(500 493)"><rect width="132" height="40" rx="20" fill="#1685ff" fill-opacity=".11" stroke="#1685ff" stroke-opacity=".55"/><text x="66" y="26" fill="#76c2ff">TCP + UDP</text></g>
    <g transform="translate(654 493)"><rect width="132" height="40" rx="20" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".2"/><text x="66" y="26" fill="#d9dfe5">.NET 10</text></g>
    <g transform="translate(808 493)"><rect width="132" height="40" rx="20" fill="#ffc21c" fill-opacity=".09" stroke="#ffc21c" stroke-opacity=".5"/><text x="66" y="26" fill="#ffd45b">.NET MAUI</text></g>
